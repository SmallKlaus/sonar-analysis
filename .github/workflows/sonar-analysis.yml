name: Universal SonarCloud Analysis

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to analyze'
        required: true
        default: 'mapreduce'
        type: choice
        options:
          - 'flink'
          - 'kafka'
          - 'hadoop_common'
          - 'hdfs'
          - 'mapreduce'
          - 'yarn'
          - 'ozone'
          - 'hbase'
          - 'camel'
      batch_number:
        description: 'Batch number to process'
        required: true
        default: '1'
        type: string

permissions:
  contents: write   # Required: allows the runner to push checkpoints back to this repo

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout analysis scripts
        uses: actions/checkout@v4
        # No 'path:' here — scripts repo lands at workspace root.
        # Internal 'scripts/' folder is then at $GITHUB_WORKSPACE/scripts/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure git and initialise checkpoints directory
        run: |
          # Configure git identity for checkpoint commits
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Create checkpoints/ at the repo root if it does not exist yet
          mkdir -p checkpoints
          if [ ! -f checkpoints/.gitkeep ]; then
            touch checkpoints/.gitkeep
            git add checkpoints/.gitkeep
            git commit -m "chore: initialise checkpoints directory" || true
            git push origin HEAD || true
          fi

          echo "✓ Git configured and checkpoints directory ready"
      
      - name: Load project configuration
        id: config
        run: |
          PROJECT="${{ github.event.inputs.project }}"
          
          # Extract config using Python and write to GITHUB_OUTPUT
          python3 << EOF
          import json
          import os
          
          # Point directly to the scripts folder from the workspace root
          with open('scripts/project_configs.json') as f:
              configs = json.load(f)
          
          config = configs.get('$PROJECT', {})
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"repository={config.get('repository', '')}\n")
              fh.write(f"build_system={config.get('build_system', 'maven')}\n")
              fh.write(f"requires_bundle={str(config.get('requires_bundle', False)).lower()}\n")
              fh.write(f"bundle_url={config.get('bundle_url', '')}\n")
          EOF

      - name: Prepare noisy batch data
        id: noisy
        env:
          PROJECT: ${{ github.event.inputs.project }}
          BATCH: ${{ github.event.inputs.batch_number }}
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          project = os.environ["PROJECT"]
          batch = os.environ["BATCH"]

          analytics_path = workspace / "checkpoints" / "sonar_analytics.json"
          batch_path = workspace / "scripts" / f"{project}_issues_batch_{batch}.json"
          filtered_dir = workspace / "checkpoints" / "filtered_batches"
          filtered_dir.mkdir(parents=True, exist_ok=True)

          if not analytics_path.exists():
              raise FileNotFoundError(f"Missing analytics file: {analytics_path}")
          if not batch_path.exists():
              raise FileNotFoundError(f"Missing batch file: {batch_path}")

          filtered_batch_path = filtered_dir / f"{project}_issues_batch_{batch}_noisy.json"
          noisy_ids_path = filtered_dir / f"{project}_noisy_report_ids.json"

          with analytics_path.open(encoding="utf-8") as fh:
              analytics = json.load(fh)

          project_analytics = analytics.get("projects", {}).get(project, {})
          noisy_reports = set(project_analytics.get("noisy_reports", []))
          noisy_batches = set(project_analytics.get("noisy_batches", []))

          with batch_path.open(encoding="utf-8") as fh:
              issues = json.load(fh)

          filtered_issues = {
              issue_id: issue
              for issue_id, issue in issues.items()
              if issue_id in noisy_reports
          }

          with filtered_batch_path.open("w", encoding="utf-8") as fh:
              json.dump(filtered_issues, fh, indent=2, ensure_ascii=False)

          with noisy_ids_path.open("w", encoding="utf-8") as fh:
              json.dump(sorted(noisy_reports), fh, indent=2, ensure_ascii=False)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"JIRA_JSON_PATH={filtered_batch_path}\n")
              fh.write(f"NOISY_REPORT_IDS_PATH={noisy_ids_path}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"filtered_issue_count={len(filtered_issues)}\n")
              fh.write(f"has_noisy_issues={str(bool(filtered_issues)).lower()}\n")

          batch_file_name = batch_path.name
          print(f"Loaded {len(noisy_reports)} noisy report IDs for {project}")
          print(f"{batch_file_name}: {len(filtered_issues)} of {len(issues)} issues will be processed")
          if noisy_batches and batch_file_name not in noisy_batches:
              print(f"Warning: {batch_file_name} is not listed as noisy in sonar_analytics.json")
          print(f"Filtered batch file: {filtered_batch_path}")
          print(f"Noisy report IDs file: {noisy_ids_path}")
          EOF
      
      - name: Checkout project repository
        if: steps.noisy.outputs.has_noisy_issues == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.repository }}
          ref: trunk
          fetch-depth: 0
          path: project
      
      - name: Import TD analysis commits (if needed)
        if: steps.noisy.outputs.has_noisy_issues == 'true' && steps.config.outputs.requires_bundle == 'true'
        run: |
          cd project
          echo "Downloading commit bundle..."
          wget -q ${{ steps.config.outputs.bundle_url }}
          BUNDLE_FILE=$(basename ${{ steps.config.outputs.bundle_url }})
          
          git bundle verify $BUNDLE_FILE
          git fetch $BUNDLE_FILE 'refs/td-analysis/*:refs/td-analysis/*'
          rm $BUNDLE_FILE
          
          echo "✓ Commits imported: $(git for-each-ref refs/td-analysis/ | wc -l)"
      
      - name: Setup Java 8
        if: steps.noisy.outputs.has_noisy_issues == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      
      - name: Setup Java 11
        if: steps.noisy.outputs.has_noisy_issues == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Setup Java 17 (default)
        if: steps.noisy.outputs.has_noisy_issues == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ${{ steps.config.outputs.build_system }}

      - name: Setup Java 21
        if: steps.noisy.outputs.has_noisy_issues == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Install SonarScanner
        if: steps.noisy.outputs.has_noisy_issues == 'true'
        run: |
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q sonar-scanner-cli-5.0.1.3006-linux.zip
          echo "$PWD/sonar-scanner-5.0.1.3006-linux/bin" >> $GITHUB_PATH
      
      - name: Configure Maven (if Maven project)
        if: steps.noisy.outputs.has_noisy_issues == 'true' && steps.config.outputs.build_system == 'maven'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.m2
          python3 scripts/generate_maven_settings.py ${{ github.event.inputs.project }}
      
      - name: Install protoc versions (required for Hadoop)
        if: steps.noisy.outputs.has_noisy_issues == 'true' && contains(fromJSON('["hadoop_common","hdfs","mapreduce","yarn"]'), github.event.inputs.project)
        run: |
          # ── protoc 2.5.0 (build from source — no pre-built binary exists) ──
          sudo apt-get install -y autoconf automake libtool curl make g++ unzip
          wget -q https://github.com/protocolbuffers/protobuf/releases/download/v2.5.0/protobuf-2.5.0.tar.gz
          tar -xzf protobuf-2.5.0.tar.gz
          cd protobuf-2.5.0
          ./configure --prefix=/usr/local/protoc-2.5.0
          make -j$(nproc)
          sudo make install
          sudo ln -sf /usr/local/protoc-2.5.0/bin/protoc /usr/local/bin/protoc-2.5.0
          cd ..
          rm -rf protobuf-2.5.0 protobuf-2.5.0.tar.gz

          # ── protoc 3.7.1 (pre-built binary exists) ──────────────────────
          wget -q https://github.com/protocolbuffers/protobuf/releases/download/v3.7.1/protoc-3.7.1-linux-x86_64.zip
          unzip -q protoc-3.7.1-linux-x86_64.zip -d protoc-3.7.1
          sudo cp protoc-3.7.1/bin/protoc /usr/local/bin/protoc-3.7.1
          rm -rf protoc-3.7.1 protoc-3.7.1-linux-x86_64.zip

          echo "✓ protoc versions installed:"
          protoc-2.5.0 --version
          protoc-3.7.1 --version
      
      - name: Run analysis
        if: steps.noisy.outputs.has_noisy_issues == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          PROJECT_NAME: ${{ github.event.inputs.project }}
          BATCH_NUMBER: ${{ github.event.inputs.batch_number }}
          PROJECT_REPO_PATH: ${{ github.workspace }}/project
          SCRIPTS_REPO_PATH: ${{ github.workspace }}   # Root of the scripts repo (contains scripts/ and checkpoints/)
          SONAR_SCANNER_OPTS: "-Xmx6656m -XX:+UseG1GC -XX:MaxMetaspaceSize=384m"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
          GITHUB_ACTOR: ${{ github.actor }}             
        run: |
          cd project
          mkdir -p output
          python3 ../scripts/universal_sonar_analysis.py

      - name: Stage noisy IDs artifact
        if: always()
        run: |
          mkdir -p project/output
          if [ -n "$NOISY_REPORT_IDS_PATH" ] && [ -f "$NOISY_REPORT_IDS_PATH" ]; then
            cp "$NOISY_REPORT_IDS_PATH" project/output/noisy_report_ids.json
          else
            echo "No noisy report IDs file to stage."
          fi
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.event.inputs.project }}-batch-${{ github.event.inputs.batch_number }}
          path: project/output/
          retention-days: 90
