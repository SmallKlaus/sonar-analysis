name: Universal SonarCloud Analysis

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to analyze'
        required: true
        default: 'kafka'
        type: choice
        options:
          - 'flink'
          - 'kafka'
          - 'hadoop_common'
          - 'hdfs'
          - 'mapreduce'
          - 'yarn'
      batch_number:
        description: 'Batch number to process'
        required: true
        default: '1'
        type: string

permissions:
  contents: write   # Required: allows the runner to push checkpoints back to this repo

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout analysis scripts
        uses: actions/checkout@v4
        # No 'path:' here — scripts repo lands at workspace root.
        # Internal 'scripts/' folder is then at $GITHUB_WORKSPACE/scripts/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure git and initialise checkpoints directory
        run: |
          # Configure git identity for checkpoint commits
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Create checkpoints/ at the repo root if it does not exist yet
          mkdir -p checkpoints
          if [ ! -f checkpoints/.gitkeep ]; then
            touch checkpoints/.gitkeep
            git add checkpoints/.gitkeep
            git commit -m "chore: initialise checkpoints directory" || true
            git push origin HEAD || true
          fi

          echo "✓ Git configured and checkpoints directory ready"
      
      - name: Load project configuration
        id: config
        run: |
          PROJECT="${{ github.event.inputs.project }}"
          
          # Extract config using Python and write to GITHUB_OUTPUT
          python3 << EOF
          import json
          import os
          
          # Point directly to the scripts folder from the workspace root
          with open('scripts/project_configs.json') as f:
              configs = json.load(f)
          
          config = configs.get('$PROJECT', {})
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"repository={config.get('repository', '')}\n")
              fh.write(f"build_system={config.get('build_system', 'maven')}\n")
              fh.write(f"requires_bundle={str(config.get('requires_bundle', False)).lower()}\n")
              fh.write(f"bundle_url={config.get('bundle_url', '')}\n")
          EOF
      
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.repository }}
          ref: trunk
          fetch-depth: 0
          path: project
      
      - name: Import TD analysis commits (if needed)
        if: steps.config.outputs.requires_bundle == 'true'
        run: |
          cd project
          echo "Downloading commit bundle..."
          wget -q ${{ steps.config.outputs.bundle_url }}
          BUNDLE_FILE=$(basename ${{ steps.config.outputs.bundle_url }})
          
          git bundle verify $BUNDLE_FILE
          git fetch $BUNDLE_FILE 'refs/td-analysis/*:refs/td-analysis/*'
          rm $BUNDLE_FILE
          
          echo "✓ Commits imported: $(git for-each-ref refs/td-analysis/ | wc -l)"
      
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Setup Java 17 (default)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ${{ steps.config.outputs.build_system }}
      
      - name: Install SonarScanner
        run: |
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q sonar-scanner-cli-5.0.1.3006-linux.zip
          echo "$PWD/sonar-scanner-5.0.1.3006-linux/bin" >> $GITHUB_PATH
      
      - name: Configure Maven (if Maven project)
        if: steps.config.outputs.build_system == 'maven'
        run: |
          mkdir -p ~/.m2
          python3 scripts/generate_maven_settings.py ${{ github.event.inputs.project }}
      
      - name: Verify batch data
        run: |
          PROJECT="${{ github.event.inputs.project }}"
          BATCH="${{ github.event.inputs.batch_number }}"
          
          echo "✓ Processing ${PROJECT} batch ${BATCH}"
          ls -lh scripts/${PROJECT}_issues_batch_${BATCH}.json

      - name: Install protoc (required for Hadoop)
        if: github.event.inputs.project == 'hadoop_common' || github.event.inputs.project == 'hdfs' || github.event.inputs.project == 'mapreduce' || github.event.inputs.project == 'yarn'
        run: |
          sudo apt-get install -y protobuf-compiler
          protoc --version
          echo "✓ protoc installed"

      - name: Install protoc 3.7.1 (required for Hadoop 3.x)
        if: github.event.inputs.project == 'hadoop_common' || github.event.inputs.project == 'hdfs' || github.event.inputs.project == 'mapreduce' || github.event.inputs.project == 'yarn'
        run: |
          # Install exact version Hadoop 3.x expects
          PROTOC_VERSION=3.7.1
          wget -q https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip
          unzip -q protoc-${PROTOC_VERSION}-linux-x86_64.zip -d protoc-${PROTOC_VERSION}
          sudo cp protoc-${PROTOC_VERSION}/bin/protoc /usr/local/bin/
          sudo chmod +x /usr/local/bin/protoc
          rm -rf protoc-${PROTOC_VERSION} protoc-${PROTOC_VERSION}-linux-x86_64.zip
          protoc --version
          echo "✓ protoc ${PROTOC_VERSION} installed"
      
      - name: Run analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          PROJECT_NAME: ${{ github.event.inputs.project }}
          BATCH_NUMBER: ${{ github.event.inputs.batch_number }}
          PROJECT_REPO_PATH: ${{ github.workspace }}/project
          SCRIPTS_REPO_PATH: ${{ github.workspace }}   # Root of the scripts repo (contains scripts/ and checkpoints/)
          SONAR_SCANNER_OPTS: "-Xmx6656m -XX:+UseG1GC -XX:MaxMetaspaceSize=384m"
        run: |
          cd project
          mkdir -p output
          python3 ../scripts/universal_sonar_analysis.py
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.event.inputs.project }}-batch-${{ github.event.inputs.batch_number }}
          path: project/output/
          retention-days: 90
