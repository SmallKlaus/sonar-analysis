name: Universal Sonar Analysis (self-hosted SonarQube)

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to analyze'
        required: true
        default: 'camel'
        type: choice
        options:
          - 'flink'
          - 'kafka'
          - 'hadoop_common'
          - 'hdfs'
          - 'mapreduce'
          - 'yarn'
          - 'ozone'
          - 'hbase'
          - 'camel'
      batch_number:
        description: 'Batch number to process'
        required: true
        default: '1'
        type: string
      java_version:
        description: 'Java version to enforce for this run (auto = automatic per-commit selection)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '8'
          - '11'
          - '17'
          - '21'

permissions:
  contents: write   # Required: allows the runner to push checkpoints back to this repo

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout analysis scripts
        uses: actions/checkout@v4
        # No 'path:' here — scripts repo lands at workspace root.
        # Internal 'scripts/' folder is then at $GITHUB_WORKSPACE/scripts/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure git and initialise checkpoints directory
        run: |
          # Configure git identity for checkpoint commits
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Create checkpoints/ at the repo root if it does not exist yet
          mkdir -p checkpoints
          if [ ! -f checkpoints/.gitkeep ]; then
            touch checkpoints/.gitkeep
            git add checkpoints/.gitkeep
            git commit -m "chore: initialise checkpoints directory" || true
            git push origin HEAD || true
          fi

          echo "✓ Git configured and checkpoints directory ready"

      - name: Load project configuration
        id: config
        run: |
          PROJECT="${{ github.event.inputs.project }}"

          # Extract config using Python and write to GITHUB_OUTPUT
          python3 << EOF
          import json
          import os

          # Point directly to the scripts folder from the workspace root
          with open('scripts/project_configs.json') as f:
              configs = json.load(f)

          config = configs.get('$PROJECT', {})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"repository={config.get('repository', '')}\n")
              fh.write(f"build_system={config.get('build_system', 'maven')}\n")
              fh.write(f"requires_bundle={str(config.get('requires_bundle', False)).lower()}\n")
              fh.write(f"bundle_url={config.get('bundle_url', '')}\n")
          EOF

      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.repository }}
          ref: main
          fetch-depth: 0
          path: project

      - name: Import TD analysis commits (if needed)
        if: steps.config.outputs.requires_bundle == 'true'
        run: |
          cd project
          echo "Downloading commit bundle..."
          wget -q ${{ steps.config.outputs.bundle_url }}
          BUNDLE_FILE=$(basename ${{ steps.config.outputs.bundle_url }})

          git bundle verify $BUNDLE_FILE
          git fetch $BUNDLE_FILE 'refs/td-analysis/*:refs/td-analysis/*'
          rm $BUNDLE_FILE

          echo "✓ Commits imported: $(git for-each-ref refs/td-analysis/ | wc -l)"

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Java 17 (default)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ${{ steps.config.outputs.build_system }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SonarScanner
        run: |
          # Scanner 8.x bundles a Java 21 JRE — required since July 2026
          # (SonarCloud rejects Java 17 scanner runtimes; the bundled launcher
          # ignores JAVA_HOME, so the JRE must come from the scanner package).
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip
          unzip -q sonar-scanner-cli-8.1.0.6389-linux-x64.zip
          echo "$PWD/sonar-scanner-8.1.0.6389-linux-x64/bin" >> $GITHUB_PATH

      - name: Configure Maven (if Maven project)
        if: steps.config.outputs.build_system == 'maven'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.m2
          python3 scripts/generate_maven_settings.py ${{ github.event.inputs.project }}

      - name: Install protoc versions (required for Hadoop)
        if: contains(fromJSON('["hadoop_common","hdfs","mapreduce","yarn"]'), github.event.inputs.project)
        run: |
          # ── protoc 2.5.0 (build from source — no pre-built binary exists) ──
          sudo apt-get install -y autoconf automake libtool curl make g++ unzip
          wget -q https://github.com/protocolbuffers/protobuf/releases/download/v2.5.0/protobuf-2.5.0.tar.gz
          tar -xzf protobuf-2.5.0.tar.gz
          cd protobuf-2.5.0
          ./configure --prefix=/usr/local/protoc-2.5.0
          make -j$(nproc)
          sudo make install
          sudo ln -sf /usr/local/protoc-2.5.0/bin/protoc /usr/local/bin/protoc-2.5.0
          cd ..
          rm -rf protobuf-2.5.0 protobuf-2.5.0.tar.gz

          # ── protoc 3.7.1 (pre-built binary exists) ──────────────────────
          wget -q https://github.com/protocolbuffers/protobuf/releases/download/v3.7.1/protoc-3.7.1-linux-x86_64.zip
          unzip -q protoc-3.7.1-linux-x86_64.zip -d protoc-3.7.1
          sudo cp protoc-3.7.1/bin/protoc /usr/local/bin/protoc-3.7.1
          rm -rf protoc-3.7.1 protoc-3.7.1-linux-x86_64.zip

          echo "✓ protoc versions installed:"
          protoc-2.5.0 --version
          protoc-3.7.1 --version

      - name: Purge corrupted jars from Maven cache
        run: |
          # The restored ~/.m2 cache can contain poisoned artefacts — an HTML
          # error page or truncated download saved as a .jar fails builds with
          # "zip END header not found" on every run until evicted. Drop any
          # jar that is not a valid zip so Maven re-fetches it.
          python3 << 'EOF'
          import os, zipfile
          root = os.path.expanduser("~/.m2/repository")
          removed = 0
          if os.path.isdir(root):
              for dirpath, _, files in os.walk(root):
                  for name in files:
                      if name.endswith(".jar"):
                          path = os.path.join(dirpath, name)
                          if not zipfile.is_zipfile(path):
                              print(f"Removing corrupt jar: {path}")
                              os.remove(path)
                              removed += 1
          print(f"Cache check complete - {removed} corrupt jar(s) removed")
          EOF

      - name: Start self-hosted SonarQube (Community Edition)
        env:
          # Pin to a concrete "<ver>-community" tag from Docker Hub for full
          # reproducibility; "community" tracks the latest Community build.
          SONARQUBE_IMAGE: sonarqube:community
        run: |
          set -euo pipefail

          # Embedded Elasticsearch requires raised mmap + file-descriptor limits.
          sudo sysctl -w vm.max_map_count=524288
          sudo sysctl -w fs.file-max=131072

          # JVM heaps sized to co-exist with the build and scanner on a runner.
          # Xms kept low so the server barely reserves RAM while the build runs;
          # the CE heap expands only during report processing (after the scanner
          # process has exited), so peak build/scan/CE phases don't stack.
          docker run -d --name sonarqube \
            -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            -e SONAR_WEB_JAVAOPTS="-Xmx512m -Xms128m" \
            -e SONAR_CE_JAVAOPTS="-Xmx2048m -Xms256m" \
            -e SONAR_SEARCH_JAVAOPTS="-Xmx1024m -Xms1024m" \
            "$SONARQUBE_IMAGE"

          echo "Waiting for SonarQube to reach status UP (up to ~5 min)..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s http://localhost:9000/api/system/status \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            echo "  [$i/60] status=${STATUS:-<no response yet>}"
            if [ "$STATUS" = "UP" ]; then break; fi
            if [ "$i" = "60" ]; then
              echo "::error::SonarQube did not reach UP in time"
              docker logs sonarqube | tail -80
              exit 1
            fi
            sleep 5
          done

          # First run: change the default admin password (required before the
          # token API will issue tokens), then mint an analysis token.
          NEW_PW="Sonar_CI_${GITHUB_RUN_ID}"
          curl -s -u admin:admin -X POST http://localhost:9000/api/users/change_password \
            -d "login=admin" -d "previousPassword=admin" -d "password=${NEW_PW}" >/dev/null || true

          TOKEN_JSON=$(curl -s -u "admin:${NEW_PW}" -X POST \
            http://localhost:9000/api/user_tokens/generate -d "name=ci-${GITHUB_RUN_ID}-${RANDOM}")
          SONAR_TOKEN=$(echo "$TOKEN_JSON" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || echo "")

          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Failed to generate SonarQube token. Response: $TOKEN_JSON"
            docker logs sonarqube | tail -80
            exit 1
          fi

          # Hand the local URL + token to later steps; mask the token in logs.
          # SONAR_ORGANIZATION is deliberately NOT set -> script runs self-hosted.
          echo "::add-mask::$SONAR_TOKEN"
          echo "SONAR_TOKEN=$SONAR_TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_HOST_URL=http://localhost:9000" >> "$GITHUB_ENV"
          echo "✓ SonarQube is UP and analysis token provisioned"

      - name: Run analysis
        env:
          # SONAR_TOKEN and SONAR_HOST_URL are injected by the SonarQube startup
          # step via $GITHUB_ENV. SONAR_ORGANIZATION is intentionally unset so
          # the script uses self-hosted (org-less) component keys.
          PROJECT_NAME: ${{ github.event.inputs.project }}
          BATCH_NUMBER: ${{ github.event.inputs.batch_number }}
          FORCE_JAVA_VERSION: ${{ github.event.inputs.java_version }}
          PROJECT_REPO_PATH: ${{ github.workspace }}/project
          SCRIPTS_REPO_PATH: ${{ github.workspace }}   # Root of the scripts repo (contains scripts/ and checkpoints/)
          # Scanner heap trimmed from 6656m so it co-exists with the SonarQube
          # server on the runner. Raise it if you move to larger (16 GB) runners.
          SONAR_SCANNER_JAVA_OPTS: "-Xmx3072m -XX:+UseG1GC -XX:MaxMetaspaceSize=384m"
          SONAR_SCANNER_OPTS: "-Xmx3072m -XX:+UseG1GC -XX:MaxMetaspaceSize=384m"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cd project
          mkdir -p output
          python3 ../scripts/universal_sonar_analysis.py

      - name: Dump SonarQube server logs on failure
        if: failure()
        run: docker logs sonarqube 2>&1 | tail -200 || true

      - name: Ensure output directory exists
        if: always()
        run: mkdir -p project/output

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.event.inputs.project }}-batch-${{ github.event.inputs.batch_number }}
          path: project/output/
          retention-days: 90
